name: vietnam-car-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vietnam_car_platform}
      POSTGRES_USER: ${POSTGRES_USER:-vcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vcp-local-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-socket:/var/run/postgresql
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vcp} -d ${POSTGRES_DB:-vietnam_car_platform}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-vcp-local}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-vcp-local-dev}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 ${OBJECT_STORAGE_ACCESS_KEY:-vcp-local} ${OBJECT_STORAGE_SECRET_KEY:-vcp-local-dev} &&
      mc mb --ignore-existing local/${OBJECT_STORAGE_BUCKET:-vcp-snapshots} &&
      mc version enable local/${OBJECT_STORAGE_BUCKET:-vcp-snapshots} &&
      mc anonymous set none local/${OBJECT_STORAGE_BUCKET:-vcp-snapshots}
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/src/Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      APPLY_DATABASE_MIGRATIONS: ${APPLY_DATABASE_MIGRATIONS:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: Host=/var/run/postgresql;Database=${POSTGRES_DB:-vietnam_car_platform};Username=${POSTGRES_USER:-vcp}
      REDIS_URL: redis:6379
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_HEALTH_ENDPOINT: http://minio:9000/minio/health/live
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-vcp-snapshots}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-vcp-local}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-vcp-local-dev}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@vcp.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-vcp-admin-local-dev-only}
    ports:
      - "8080:8080"
    volumes:
      - postgres-socket:/var/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      API_INTERNAL_BASE_URL: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ingestion-worker:
    build:
      context: .
      dockerfile: workers/ingestion/Dockerfile
    environment: &worker-environment
      REDIS_URL: redis://redis:6379/0
      INGESTION_QUEUE: ${INGESTION_QUEUE:-ingestion:jobs}
      INGESTION_USER_AGENT: ${INGESTION_USER_AGENT:-VietnamCarPlatformBot/0.1}
      INGESTION_MAX_CONCURRENCY: ${INGESTION_MAX_CONCURRENCY:-4}
      INGESTION_SCHEDULE_SECONDS: ${INGESTION_SCHEDULE_SECONDS:-60}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_HEALTH_ENDPOINT: http://minio:9000/minio/health/live
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-vcp-snapshots}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-vcp-local}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-vcp-local-dev}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
      SOURCE_REGISTRY_PATH: /app/data/source-registry.v1.json
      SNAPSHOT_EVENT_QUEUE: ${SNAPSHOT_EVENT_QUEUE:-ingestion:snapshots}
      DISCOVERY_CANDIDATE_QUEUE: ${DISCOVERY_CANDIDATE_QUEUE:-ingestion:discovery-candidates}
      DISCOVERY_QUERY_TEMPLATES_PATH: /app/data/discovery-query-templates.v2.json
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      BRAVE_MONTHLY_REQUEST_BUDGET: ${BRAVE_MONTHLY_REQUEST_BUDGET:-1000}
      BRAVE_DISCOVERY_CACHE_SECONDS: ${BRAVE_DISCOVERY_CACHE_SECONDS:-86400}
      BRAVE_DISCOVERY_MAX_QUERIES: ${BRAVE_DISCOVERY_MAX_QUERIES:-4}
      PARSER_REGISTRY_PATH: /app/data/parser-registry.v2.json
      PARSED_DOCUMENT_QUEUE: ${PARSED_DOCUMENT_QUEUE:-ingestion:parsed-documents}
      PARSER_MAX_CONTENT_BYTES: ${PARSER_MAX_CONTENT_BYTES:-20000000}
      PARSER_MAX_PDF_PAGES: ${PARSER_MAX_PDF_PAGES:-500}
      POSTGRES_DSN: host=/var/run/postgresql dbname=${POSTGRES_DB:-vietnam_car_platform} user=${POSTGRES_USER:-vcp}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "ingestion.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres-socket:/var/run/postgresql

  ingestion-scheduler:
    build:
      context: .
      dockerfile: workers/ingestion/Dockerfile
    command: ["python", "-m", "ingestion.scheduler"]
    environment: *worker-environment
    volumes:
      - postgres-socket:/var/run/postgresql
    healthcheck:
      test: ["CMD", "python", "-m", "ingestion.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      ingestion-worker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  postgres-socket:
  redis-data:
  minio-data:
