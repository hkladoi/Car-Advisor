title = "Vietnam Car Platform secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Generated dependencies, build outputs and local runtime artifacts are not source inputs."
paths = [
  '''(^|/)(node_modules|\.next|bin|obj|\.venv|output|\.tmp|TestResults|\.pytest_cache)(/|$)''',
]

[[allowlists]]
description = "Registration-rule stable identifiers are domain keys, not API credentials."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)data/seed/v1\.5-registration-rules\.json$''']
regexTarget = "line"
regexes = ['''^\s*"key": "(plate-area-i-passenger-up-to-9-2026|plate-area-ii-passenger-up-to-9-2026|compulsory-insurance-6-to-11-seats-2023)",?\s*$''']
